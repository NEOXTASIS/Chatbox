<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#050505">
<meta name="color-scheme" content="dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com wss://*.firebaseio.com; frame-src https://*.firebaseapp.com https://accounts.google.com; base-uri 'self'; form-action 'self'; object-src 'none'">
<title>Chatbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050505; --win:#0a0a0a; --ink:#f4f4f2; --muted:#8c8c8c; --dim:#5c5c5c; --hover:rgba(255,255,255,.07); --danger:#ff8f86;
  --display:"Unbounded","Arial Black","Helvetica Neue",Arial,sans-serif;
  --sans:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark; box-sizing:border-box;
}
html{height:100%;-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;height:100%;height:100dvh;display:flex;flex-direction:column;align-items:center;color:var(--ink);font:400 14px/1.55 var(--sans);
  background:var(--bg);overflow:hidden;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);
  -webkit-tap-highlight-color:transparent}
input,textarea,button{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:transparent}
input,textarea{outline:none!important;caret-color:#fff}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}

.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;
  background:radial-gradient(900px 520px at 20% -5%,#1e1e1e 0%,transparent 70%),var(--bg)}
.bg svg{position:absolute;inset:0;width:100%;height:100%}

.home{position:relative;z-index:1;margin:auto;width:100%;max-width:400px;padding:24px;text-align:center;display:grid;gap:14px;justify-items:center}
.home .mark{width:44px;height:44px;border-radius:13px;font-size:24px}
.home h1{font:500 clamp(2rem,9vw,3.2rem)/1.05 var(--display);margin:6px 0 0;letter-spacing:-.01em}
.home .tag{color:var(--muted);margin:0 0 8px}
.home form{width:100%;display:grid;gap:10px}
.field{width:100%;border:0;border-radius:14px;background:rgba(255,255,255,.08);padding:14px 16px;text-align:center;font-size:16px}
.field::placeholder{color:var(--dim)}
.err{color:var(--danger);font-size:13px;min-height:1.3em;text-align:center}
.btn{flex:1;padding:12px 16px;border-radius:999px;background:var(--hover);font-weight:600;transition:transform .18s ease,box-shadow .18s ease}
.btn.primary{background:#fff;color:#0a0a0f}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,0,0,.5)}
.btn:disabled{opacity:.5;transform:none;box-shadow:none;cursor:default}
.fine{color:var(--dim);font-size:12px;margin:2px 0 0}

.win{position:relative;z-index:1;flex:1;min-height:0;width:calc(100% - 20px);max-width:860px;margin:10px 0;display:flex;flex-direction:column;border-radius:16px;overflow:hidden;
  background:rgba(10,10,10,.94);box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.06)}
.head{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;flex:none}
.brand{display:flex;align-items:center;gap:10px;font:500 14px/1 var(--display);letter-spacing:.02em}
.mark{display:grid;place-items:center;width:24px;height:24px;border-radius:7px;background:#fff;color:#0a0a0a;font:700 14px var(--sans)}
.me{display:flex;align-items:center;gap:10px;padding:5px 12px 5px 5px;border-radius:999px;transition:transform .18s ease,background .18s ease,box-shadow .18s ease}
.me:hover{background:var(--hover);transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,0,0,.5)}
.me span{font-weight:600;max-width:140px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:34px;height:34px;flex:none;border-radius:50%;background:#262626;display:grid;place-items:center;font:500 12px var(--display);overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.thread{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:6px 20px 16px;display:flex;flex-direction:column;scrollbar-width:thin;scrollbar-color:#2a2a2a transparent}
.thread::before{content:"";margin-top:auto}
.empty{margin:auto;color:var(--dim);text-align:center}
.day{align-self:center;margin:16px 0 4px;color:var(--dim);font-size:12px}
.row{display:flex;gap:10px;align-items:flex-end;margin-top:3px}
.row.first{margin-top:14px}
.row.mine{justify-content:flex-end}
.avw{width:34px;flex:none}
.col{display:flex;flex-direction:column;max-width:min(78%,560px);min-width:0}
.row.mine .col{align-items:flex-end}
.meta{color:var(--dim);font-size:12px;margin:0 8px 4px}
.bub{background:#1b1b1b;padding:9px 14px;border-radius:18px 18px 18px 6px;white-space:pre-wrap;overflow-wrap:anywhere;cursor:default;
  transition:transform .18s ease,box-shadow .18s ease}
.row.mine .bub{background:#f4f4f2;color:#0a0a0a;border-radius:18px 18px 6px 18px}
.row.can .bub{cursor:pointer}
.bub:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,0,0,.55)}
.dl{display:none;margin:4px 6px 0;padding:6px 4px;color:var(--danger);font-size:12px}
.row.can:hover .dl,.row.can.sel .dl{display:block}
.composer{flex:none;display:flex;align-items:flex-end;gap:10px;padding:12px 16px 16px}
#msg{flex:1;min-width:0;border:0;border-radius:22px;background:var(--hover);padding:12px 18px;resize:none;max-height:140px;line-height:1.5;overflow-y:auto;font-size:16px}
#msg::placeholder{color:var(--dim)}
.send{flex:none;width:44px;height:44px;border-radius:50%;background:#fff;color:#0a0a0f;font-weight:700;font-size:18px;transition:transform .18s ease,box-shadow .18s ease}
.send:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,0,0,.5)}
.send:disabled{opacity:.35;transform:none;box-shadow:none;cursor:default}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:grid;place-items:center;padding:20px;z-index:20}
.card{width:100%;max-width:360px;background:#111;border-radius:18px;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.08);display:grid;gap:14px;justify-items:center}
.card h2{font:500 1rem/1.3 var(--display);margin:0}
.pick{position:relative;width:96px;height:96px;border-radius:50%;background:#262626;overflow:hidden;display:grid;place-items:center;font:500 28px var(--display);transition:transform .18s ease}
.pick:hover{transform:translateY(-2px)}
.pick img{width:100%;height:100%;object-fit:cover}
.pick small{position:absolute;inset:auto 0 0;background:rgba(0,0,0,.6);font:600 11px var(--sans);padding:3px 0;text-align:center}
.btns{display:flex;gap:10px;width:100%}
.out{color:var(--muted);font-size:13px;padding:4px 8px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#fff;color:#0a0a0f;padding:10px 16px;border-radius:999px;font-weight:600;z-index:30;max-width:90%}

@media (max-width:760px){.win{width:100%;margin:0;border-radius:0;flex:1}.head{padding:12px 14px}.thread{padding:4px 12px 12px}.col{max-width:84%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="bg" aria-hidden="true">
  <svg viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".95"/><stop offset="1" stop-color="#6b6b6b" stop-opacity=".55"/></linearGradient>
      <linearGradient id="g2" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9d9d6"/><stop offset="1" stop-color="#2a2a2a"/></linearGradient>
      <linearGradient id="g3" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#555"/></linearGradient>
      <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="46"/></filter>
      <filter id="soft" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="1.2"/></filter>
    </defs>
    <g filter="url(#blur)">
      <path fill="url(#g1)" opacity=".42" d="M180,260 C120,120 340,40 480,120 C620,200 700,120 780,230 C880,360 760,470 640,500 C520,530 560,680 420,700 C280,720 240,600 200,500 C160,410 230,350 180,260Z"/>
      <path fill="url(#g2)" opacity=".38" d="M620,640 C720,560 900,600 920,740 C940,880 780,960 640,920 C520,885 520,720 620,640Z"/>
      <path fill="url(#g3)" opacity=".3" d="M-40,760 C60,660 240,700 280,820 C320,940 160,1040 40,1000 C-60,960 -120,860 -40,760Z"/>
      <path fill="url(#g1)" opacity=".22" d="M760,40 C860,0 1040,60 1030,180 C1020,300 880,330 800,270 C720,210 680,80 760,40Z"/>
    </g>
    <g filter="url(#soft)" fill="none" stroke="#fff" stroke-linecap="round">
      <path stroke-width="1.4" opacity=".16" d="M-60,430 C200,300 320,640 520,530 C700,430 860,300 1060,470"/>
      <path stroke-width="1" opacity=".12" d="M-40,560 C220,470 360,760 560,640 C740,540 880,460 1060,600"/>
      <path stroke-width="1.8" opacity=".1" d="M120,-40 C60,200 300,260 240,480 C190,650 330,780 280,1060"/>
    </g>
  </svg>
</div>

<section id="home" class="home">
  <span class="mark">~</span>
  <h1>Chatbox</h1>
  <p class="tag">Private room. Invited members only.</p>
  <form id="login" autocomplete="on" novalidate>
    <input id="email" class="field" type="email" inputmode="email" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Email" aria-label="Email" required>
    <input id="pass" class="field" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password" required>
    <div id="lerr" class="err" role="alert"></div>
    <div class="btns"><button id="lbtn" class="btn primary" type="submit">Enter</button></div>
  </form>
  <p class="fine">Access is by invitation only.</p>
</section>

<main id="win" class="win" hidden>
  <header class="head">
    <div class="brand"><span class="mark">~</span>Chatbox</div>
    <button id="me" class="me" hidden aria-label="Edit your profile"></button>
  </header>
  <section id="app" style="display:flex;flex:1;min-height:0;flex-direction:column">
    <div id="thread" class="thread" aria-live="polite"></div>
    <div class="composer">
      <textarea id="msg" rows="1" maxlength="2000" placeholder="Write a message…" aria-label="Write a message"></textarea>
      <button id="send" class="send" aria-label="Send message">↑</button>
    </div>
  </section>
</main>

<div id="modal" class="modal" hidden>
  <div class="card" role="dialog" aria-label="Your profile">
    <h2 id="mtitle">Set up your profile</h2>
    <button id="pick" class="pick" aria-label="Choose a profile picture"></button>
    <input id="pfile" type="file" accept="image/*" hidden>
    <input id="pname" class="field" maxlength="20" placeholder="Choose a username" aria-label="Username" autocomplete="off">
    <div id="perr" class="err"></div>
    <div class="btns"><button id="pcancel" class="btn">Cancel</button><button id="psave" class="btn primary">Save</button></div>
    <button id="pout" class="out">Sign out</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var auth=null,db=null,uid=null,isOwner=false,profiles={},msgs=[],mine=null,stickNext=true,newAvatar="",required=false,toastT=null,unsubs=[],handledDenied=false;
  var coarse=!!(window.matchMedia&&matchMedia("(pointer:coarse)").matches);

  function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
  function nameOf(p){return p&&p.name?p.name:"Someone"}
  function tm(t){return new Date(t).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"})}
  function dy(t){return new Date(t).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"})}
  function avatar(p){
    var a=el("div","av");
    if(p&&p.avatar&&/^data:image\//.test(p.avatar)){var i=document.createElement("img");i.src=p.avatar;i.alt="";a.appendChild(i)}
    else a.textContent=(nameOf(p).charAt(0)||"?").toUpperCase();
    return a;
  }
  function toast(t){
    var o=document.querySelector(".toast");if(o)o.remove();
    var d=el("div","toast",t);document.body.appendChild(d);
    clearTimeout(toastT);toastT=setTimeout(function(){d.remove()},3500);
  }
  function showHome(msg){
    $("win").hidden=true;$("modal").hidden=true;$("home").hidden=false;
    $("lerr").textContent=msg||"";$("lbtn").disabled=false;$("lbtn").textContent="Enter";
  }
  function showChat(){$("home").hidden=true;$("win").hidden=false}
  function stopListening(){unsubs.forEach(function(u){try{u()}catch(e){}});unsubs=[];profiles={};msgs=[];mine=null}

  function paintMe(){
    var b=$("me");b.textContent="";
    if(!mine){b.hidden=true;return}
    b.hidden=false;b.appendChild(avatar(mine));b.appendChild(el("span","",mine.name));
  }
  function render(){
    var th=$("thread"),near=th.scrollHeight-th.scrollTop-th.clientHeight<90;
    th.textContent="";
    if(!msgs.length){th.appendChild(el("div","empty","No messages yet. Say hi!"));return}
    var lastDay="",lastU=null,lastT=0;
    msgs.forEach(function(m){
      var d=dy(m.t);
      if(d!==lastDay){th.appendChild(el("div","day",d));lastDay=d;lastU=null}
      var isMe=m.uid===uid,p=profiles[m.uid],can=isMe||isOwner;
      var first=!(lastU===m.uid&&m.t-lastT<300000);
      lastU=m.uid;lastT=m.t;
      var row=el("div","row"+(isMe?" mine":"")+(first?" first":"")+(can?" can":""));
      if(!isMe){var w=el("div","avw");if(first)w.appendChild(avatar(p));row.appendChild(w)}
      var col=el("div","col");
      if(first)col.appendChild(el("div","meta",isMe?tm(m.t):nameOf(p)+" • "+tm(m.t)));
      var b=el("div","bub",m.text);col.appendChild(b);
      if(can){
        b.onclick=function(){row.classList.toggle("sel")};
        var dl=el("button","dl","Delete");
        dl.onclick=function(){
          if(dl.dataset.a!=="1"){dl.dataset.a="1";dl.textContent="Tap again to delete";setTimeout(function(){dl.dataset.a="0";dl.textContent="Delete"},3000);return}
          db.collection("messages").doc(m.id).delete().catch(function(){toast("Couldn’t delete that message.")});
        };
        col.appendChild(dl);
      }
      row.appendChild(col);th.appendChild(row);
    });
    if(near||stickNext){th.scrollTop=th.scrollHeight;stickNext=false}
  }
  function fit(){var t=$("msg");t.style.height="auto";t.style.height=Math.min(t.scrollHeight,140)+"px"}
  function send(){
    var ta=$("msg"),v=ta.value.trim();
    if(!v||!mine||!db)return;
    ta.value="";fit();stickNext=true;
    db.collection("messages").add({uid:uid,text:v.slice(0,2000),t:Date.now()}).catch(function(){
      ta.value=v;fit();toast("Couldn’t send that message.");
    });
  }

  function paintPick(){
    var b=$("pick");b.textContent="";
    var n=$("pname").value.trim();
    if(newAvatar){var i=document.createElement("img");i.src=newAvatar;i.alt="";b.appendChild(i)}
    else b.appendChild(document.createTextNode((n.charAt(0)||"+").toUpperCase()));
    b.appendChild(el("small","","Change photo"));
  }
  function openProfile(req){
    required=req;
    $("mtitle").textContent=req?"Set up your profile":"Your profile";
    $("pname").value=mine?mine.name:"";newAvatar=mine?(mine.avatar||""):"";
    $("pcancel").hidden=req;$("perr").textContent="";
    $("modal").hidden=false;paintPick();$("pname").focus();
  }
  function toAvatar(file){
    return new Promise(function(res,rej){
      if(!/^image\//.test(file.type))return rej();
      var r=new FileReader();
      r.onload=function(){
        var i=new Image();
        i.onload=function(){
          var s=160,c=document.createElement("canvas");c.width=c.height=s;
          var m=Math.min(i.width,i.height);
          c.getContext("2d").drawImage(i,(i.width-m)/2,(i.height-m)/2,m,m,0,0,s,s);
          res(c.toDataURL("image/jpeg",0.82));
        };
        i.onerror=rej;i.src=r.result;
      };
      r.onerror=rej;r.readAsDataURL(file);
    });
  }
  function saveProfile(){
    var name=$("pname").value.trim(),err=$("perr");
    if(name.length<2||name.length>20){err.textContent="Username must be 2 to 20 characters.";return}
    var taken=Object.keys(profiles).some(function(k){return k!==uid&&(profiles[k].name||"").toLowerCase()===name.toLowerCase()});
    if(taken){err.textContent="That username is already taken.";return}
    db.collection("profiles").doc(uid).set({name:name,avatar:newAvatar||"",t:Date.now()}).then(function(){
      $("modal").hidden=true;
    }).catch(function(){err.textContent="Couldn’t save your profile."});
  }

  function denied(){
    if(handledDenied)return;handledDenied=true;
    stopListening();
    auth.signOut().then(function(){showHome("This account isn’t on the access list.");handledDenied=false});
  }
  function startChat(){
    showChat();
    unsubs.push(db.collection("profiles").onSnapshot(function(s){
      profiles={};
      s.docs.forEach(function(d){var v=d.data();if(v)profiles[d.id]=v});
      mine=profiles[uid]||null;paintMe();render();
      if(!mine&&!s.metadata.fromCache&&$("modal").hidden)openProfile(true);
    },denied));
    unsubs.push(db.collection("messages").orderBy("t","desc").limit(200).onSnapshot(function(s){
      msgs=s.docs.map(function(d){var v=d.data();return {id:d.id,uid:v.uid,text:v.text,t:v.t}}).reverse();
      render();
    },denied));
    if(!coarse)$("msg").focus();
  }

  $("msg").oninput=fit;
  $("msg").onkeydown=function(e){if(e.key==="Enter"&&!e.shiftKey&&!coarse){e.preventDefault();send()}};
  $("send").onclick=function(){send();if(!coarse)$("msg").focus()};
  $("me").onclick=function(){openProfile(false)};
  $("pick").onclick=function(){$("pfile").click()};
  $("pfile").onchange=function(e){
    var f=e.target.files[0];if(!f)return;
    toAvatar(f).then(function(d){newAvatar=d;$("perr").textContent="";paintPick()}).catch(function(){$("perr").textContent="Please choose an image file."});
    e.target.value="";
  };
  $("pname").oninput=function(){if(!newAvatar)paintPick()};
  $("pname").onkeydown=function(e){if(e.key==="Enter")saveProfile()};
  $("psave").onclick=saveProfile;
  $("pcancel").onclick=function(){$("modal").hidden=true};
  $("pout").onclick=function(){stopListening();auth.signOut()};
  document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!required)$("modal").hidden=true});

  $("login").onsubmit=function(e){
    e.preventDefault();
    var em=$("email").value.trim(),pw=$("pass").value;
    if(!em||!pw){$("lerr").textContent="Enter your email and password.";return}
    $("lerr").textContent="";$("lbtn").disabled=true;$("lbtn").textContent="Checking…";
    auth.signInWithEmailAndPassword(em,pw).then(function(){$("pass").value=""}).catch(function(err){
      $("lbtn").disabled=false;$("lbtn").textContent="Enter";
      var c=err&&err.code;
      $("lerr").textContent=(c==="auth/too-many-requests"?"Too many attempts. Try again later.":c==="auth/network-request-failed"?"Network problem. Check your connection.":"Incorrect email or password.")+(c?" ("+c+")":"");
    });
  };

  var cfg=window.FIREBASE_CONFIG;
  if(!cfg||!window.firebase||String(cfg.apiKey).indexOf("PASTE")===0){
    $("lbtn").disabled=true;
    $("lerr").textContent=window.firebase?"Setup needed: add your Firebase keys to firebase-config.js.":"Couldn’t load the app. Check your connection.";
    return;
  }
  firebase.initializeApp(cfg);
  auth=firebase.auth();db=firebase.firestore();
  auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(function(){});
  auth.onAuthStateChanged(function(user){
    stopListening();
    if(!user){uid=null;isOwner=false;showHome();return}
    uid=user.uid;
    isOwner=!!user.email&&!!window.OWNER_EMAIL&&user.email.toLowerCase()===String(window.OWNER_EMAIL).toLowerCase();
    startChat();
  });
})();
</script>
</body>
</html>
