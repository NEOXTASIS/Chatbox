<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
<title id="title">VOXA chrome V emblem</title>
<desc id="desc">A sharp, triple-layered metallic silver V emblem with a transparent background.</desc>
<defs>
 <linearGradient id="chrome" x1="0" y1="0" x2=".18" y2="1">
  <stop offset="0" stop-color="#f8f8fa"/>
  <stop offset=".16" stop-color="#aeb1b8"/>
  <stop offset=".31" stop-color="#f5f6f8"/>
  <stop offset=".47" stop-color="#686c74"/>
  <stop offset=".63" stop-color="#e9eaed"/>
  <stop offset=".79" stop-color="#858992"/>
  <stop offset="1" stop-color="#f5f6f8"/>
 </linearGradient>
 <linearGradient id="chrome2" x1="0" y1="0" x2=".15" y2="1">
  <stop offset="0" stop-color="#d9dbe0"/>
  <stop offset=".28" stop-color="#777b83"/>
  <stop offset=".5" stop-color="#f4f5f7"/>
  <stop offset=".72" stop-color="#777b83"/>
  <stop offset="1" stop-color="#dfe1e5"/>
 </linearGradient>
 <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
  <stop stop-color="#fff"/><stop offset=".5" stop-color="#565a62"/><stop offset="1" stop-color="#f4f5f7"/>
 </linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
  <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur"/>
  <feOffset dy="8" result="offset"/>
  <feComponentTransfer><feFuncA type="linear" slope=".42"/></feComponentTransfer>
  <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
 </filter>
</defs>
<g filter="url(#shadow)" stroke="url(#edge)" stroke-width="5" stroke-linejoin="miter">
 <path fill="url(#chrome)" fill-rule="evenodd" d="M42 92 500 365 958 92 500 944Z M176 236 500 428 824 236 500 734Z"/>
 <path fill="url(#chrome2)" fill-rule="evenodd" d="M165 236 500 438 835 236 500 824Z M286 355 500 485 714 355 500 681Z"/>
 <path fill="url(#chrome)" d="M286 355 500 485 714 355 500 681Z"/>
</g>
</svg>